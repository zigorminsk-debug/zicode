name: Build ZiCode (Android Signed APK & Windows EXE)

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    name: Build & Sign Android Release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies & build OpenCode web bundle
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm install
          npm run build
          npm test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare Persistent Android Signing Key (GitHub Secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Loaded persistent keystore from GitHub Secret ANDROID_KEYSTORE_BASE64"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zicode-release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/zicode-release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD:-zicode2026release}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-zicode-key}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-zicode2026release}" >> "$GITHUB_ENV"
          else
            echo "Using persistent project keystore android/keystores/zicode-release.p12"
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/android/keystores/zicode-release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=zicode2026release" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=zicode-key" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=zicode2026release" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APK with Gradle
        run: |
          set +e
          if ! command -v gradle >/dev/null 2>&1; then
            curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            export PATH="/tmp/gradle-8.7/bin:$PATH"
          fi
          gradle -p android assembleRelease --no-daemon > /tmp/android-build.log 2>&1
          CODE=$?
          cat /tmp/android-build.log
          if [ $CODE -ne 0 ]; then
            MSG=$(tail -n 20 /tmp/android-build.log | tr '\n' ' ')
            echo "::error title=Android Build Failed::$MSG"
            exit $CODE
          fi
          cp android/app/build/outputs/apk/release/app-release.apk ZiCode-Android-v2.7.2-Signed-Release.apk
          unzip -l ZiCode-Android-v2.7.2-Signed-Release.apk
          CERT_INFO=$(keytool -printcert -jarfile ZiCode-Android-v2.7.2-Signed-Release.apk | grep -E "Owner:|SHA256:" | tr '\n' ' ')
          echo "::notice title=Android APK Signed Successfully::$CERT_INFO"

      - name: Upload Signed Android APK & Chrome Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZiCode-Android-Signed-APK
          path: |
            ZiCode-Android-v2.7.2-Signed-Release.apk
            public/ZiCode-Chrome-Extension-v2.7.2.zip
          if-no-files-found: error

      - name: Publish Signed APK & Chrome Extension to GitHub Releases (Direct Download Link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp public/ZiCode-Chrome-Extension-v2.7.2.zip ZiCode-Chrome-Extension-v2.7.2.zip
          gh release view v2.7.2 >/dev/null 2>&1 || \
            gh release create v2.7.2 \
              --target "${{ github.sha }}" \
              --title "ZiCode v2.7.2 — OpenCode for Android (Signed APK), Windows (.exe) & Chrome Extension v2.7.2" \
              --notes "Автоматическая сборка ZiCode v2.7.2: автопоиск ветки с реальным кодом проекта (в main часто только README), загрузка файлов любых языков (Go, 1С .bsl/.mdo, C/C++, .nsi и др.), полная карта файлов ветки в промпте агента, инструмент github_read для чтения любого файла репозитория, кнопка «🐙 Работа с репозиториями GitHub» и строго опциональный доступ к браузеру."
          gh release upload v2.7.2 ZiCode-Android-v2.7.2-Signed-Release.apk ZiCode-Chrome-Extension-v2.7.2.zip --clobber

  build-windows:
    name: Build Windows Desktop (.exe Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies & Package Windows EXE
        shell: bash
        run: |
          set +e
          rm -f package-lock.json
          npm install > /tmp/win-install.log 2>&1
          ICODE=$?
          if [ $ICODE -ne 0 ]; then
            cat /tmp/win-install.log
            MSG=$(tail -n 15 /tmp/win-install.log | tr '\n' ' ')
            echo "::error title=Windows npm install failed::$MSG"
            exit $ICODE
          fi
          npm run build > /tmp/win-build.log 2>&1
          npx electron-builder --win nsis portable zip --x64 --publish never >> /tmp/win-build.log 2>&1
          BCODE=$?
          cat /tmp/win-build.log
          if [ $BCODE -ne 0 ]; then
            MSG=$(tail -n 20 /tmp/win-build.log | tr '\n' ' ')
            echo "::error title=Windows electron-builder failed::$MSG"
            exit $BCODE
          fi
          BUILT_FILES=$(ls -1 release-builds/ | tr '\n' ' ')
          echo "::notice title=Windows Builds Ready::$BUILT_FILES"

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZiCode-Windows-x64
          path: |
            release-builds/*.exe
            release-builds/*.zip
          if-no-files-found: error

      - name: Publish Windows EXE to GitHub Releases (Direct Download Links)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v2.7.2 >/dev/null 2>&1 || \
            gh release create v2.7.2 \
              --target "${{ github.sha }}" \
              --title "ZiCode v2.7.2 — OpenCode for Android (Signed APK), Windows (.exe) & Chrome Extension v2.7.2" \
              --notes "Автоматическая сборка ZiCode v2.7.2: автопоиск ветки с реальным кодом проекта (в main часто только README), загрузка файлов любых языков (Go, 1С .bsl/.mdo, C/C++, .nsi и др.), полная карта файлов ветки в промпте агента, инструмент github_read для чтения любого файла репозитория, кнопка «🐙 Работа с репозиториями GitHub» и строго опциональный доступ к браузеру."
          gh release upload v2.7.2 \
            release-builds/ZiCode-Setup-2.7.2-x64.exe \
            release-builds/ZiCode-Portable-2.7.2-x64.exe \
            release-builds/ZiCode-2.7.2-x64.zip \
            --clobber
