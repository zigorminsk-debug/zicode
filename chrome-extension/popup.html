<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>ZiCode Browser Bridge</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 360px;
        background: #0a0c10;
        color: #f0f4f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 14px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid #283042;
        margin-bottom: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 14px;
      }
      .logo {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: linear-gradient(135deg, #ff8c42, #38bdf8);
        color: #0a0c10;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 12px;
      }
      .badge {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.18);
        color: #22c55e;
        border: 1px solid rgba(34, 197, 94, 0.4);
      }
      .btn {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        border: none;
        background: #ff8c42;
        color: #0a0c10;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .btn:hover {
        opacity: 0.92;
      }
      .field {
        margin-bottom: 10px;
      }
      .field label {
        display: block;
        font-size: 11px;
        color: #9fb0c7;
        margin-bottom: 4px;
      }
      .field input[type="text"] {
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        background: #11141c;
        border: 1px solid #283042;
        color: #f0f4f8;
        font-size: 11px;
        font-family: monospace;
      }
      .tabs-list {
        max-height: 180px;
        overflow-y: auto;
        background: #11141c;
        border: 1px solid #283042;
        border-radius: 8px;
        padding: 6px;
        margin-top: 8px;
      }
      .tab-item {
        padding: 6px;
        border-bottom: 1px solid #181d27;
        font-size: 11px;
      }
      .tab-item:last-child {
        border-bottom: none;
      }
      .tab-title {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab-meta {
        font-size: 10px;
        color: #64748b;
        display: flex;
        justify-content: space-between;
        margin-top: 2px;
      }
      .status {
        font-size: 11px;
        color: #9fb0c7;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <div class="logo">OC</div>
        <span>ZiCode Chrome Bridge</span>
      </div>
      <span id="statusBadge" class="badge">Активно</span>
    </div>

    <button id="syncBtn" class="btn">🔄 Синхронизировать открытые вкладки сейчас</button>

    <div class="field">
      <label>Адрес ZiCode Server (Windows .exe / Web):</label>
      <input id="serverUrlInput" type="text" value="http://127.0.0.1:4096" />
    </div>

    <div class="field" style="display: flex; align-items: center; gap: 6px">
      <input id="autoSyncCheck" type="checkbox" checked />
      <label for="autoSyncCheck" style="margin: 0; cursor: pointer">
        Автоматически передавать открытые страницы в ZiCode
      </label>
    </div>

    <div id="summaryText" class="status">Чтение открытых вкладок...</div>
    <div id="tabsContainer" class="tabs-list"></div>

    <script src="popup.js"></script>
  </body>
</html>
